<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小文</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑";}
        body{background:#f5f9f0;}
        .container{max-width:1200px;margin:0 auto;padding:20px;}
        .section{
            background:white;border-radius:18px;padding:40px;margin:30px 0;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
        }
        .section h2{
            color:#4c7737;font-size:32px;text-align:center;margin-bottom:30px;
        }
        .nav{
            width:180px;position:fixed;left:20px;top:10vh;
            background:#8cc269;border-radius:15px;padding:15px 0;
            text-align:center;z-index:99;
        }
        .nav a{
            display:block;padding:15px;margin:10px 15px;color:white;
            text-decoration:none;font-size:20px;border-radius:10px;
            transition:0.3s;
        }
        .nav a:hover,.nav a.active{background:white;color:#8cc269;font-weight:bold;}
        .back-top{
            position:fixed;right:30px;bottom:30px;
            width:60px;height:60px;background:#8cc269;color:white;
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            text-decoration:none;
        }

        /* 小文视频样式（和原来的图片样式完全一致） */
        .xiaowen-img {
            width: 180px;
            height: auto;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-right: 50px;
            object-fit: cover;
        }
        /* 问答框外层布局 */
        .qa-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        /* 原有问答框样式（完全不变） */
        .qa-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }
        .qa-show {
            height: 350px;
            border: 1px solid #e0e9d8;
            border-radius: 12px;
            padding: 20px;
            background: #f9fff3;
            overflow-y: auto;
        }
        .msg {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 10px;
            max-width: 75%;
            line-height: 1.6;
        }
        .user {
            background: #8cc269;
            color: white;
            margin-left: auto;
        }
        .bot {
            background: white;
            color: #2d5a1a;
            border: 1px solid #8cc269;
            margin-right: auto;
        }
        .qa-input {
            display: flex;
            gap: 10px;
        }
        .qa-input input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #e0e9d8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .qa-input input:focus {
            border-color: #8cc269;
        }
        .qa-input button {
            padding: 14px 28px;
            background: #8cc269;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .qa-input button:hover {
            background: #6eaf4b;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="blank.html">视频</a>
        <a href="home.html">四方风神</a>
        <a href="detail.html">甲骨</a>
        <a href="message.html" class="active">小文</a>
    </div>

    <div class="container">
        <div class="section">
            <h2>小文</h2>
            <div class="qa-wrapper">
                <!-- 🔥 已替换为你的永久视频链接，自动循环播放 -->
                <video class="xiaowen-img" autoplay loop muted playsinline>
                    <source src="https://github.com/LIN-my29/IF-0987/issues/1#issue-4532652623" type="video/mp4">
                    您的浏览器不支持视频播放
                </video>
                
                <div class="qa-container">
                    <div class="qa-show" id="qaBox">
                        <div class="msg bot">你好！我是小文，我可以为你解答甲骨文、四方风名相关问题哦😊</div>
                    </div>
                    <div class="qa-input">
                        <input type="text" id="inputText" placeholder="请输入问题：甲骨文是什么/四方风名是什么/四方风神包括谁...">
                        <button onclick="sendMsg()">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="main.html" class="back-top">返回</a>

    <script>
        // 扩展后的问答库（完全不变）
        const answerList = {
            "你好": "你好呀！我是小文，很高兴为你解答甲骨相关问题~",
            "您好": "你好呀！我是小文，很高兴为你解答甲骨相关问题~",
            "哈喽": "你好呀！我是小文，很高兴为你解答甲骨相关问题~",
            "嗨": "你好呀！我是小文，很高兴为你解答甲骨相关问题~",
            "谢谢": "不客气！有任何问题都可以问我哦😊",
            "感谢": "不客气！有任何问题都可以问我哦😊",
            "多谢": "不客气！有任何问题都可以问我哦😊",
            "甲骨文是什么": "甲骨文是中国商周时期刻在龟甲、兽骨上的文字，是中国最早的成熟文字，主要用于占卜记事。是汉字的鼻祖，距今3000多年历史。",
            "什么是甲骨文": "甲骨文是中国商周时期刻在龟甲、兽骨上的文字，是中国最早的成熟文字，主要用于占卜记事。是汉字的鼻祖，距今3000多年历史。",
            "甲骨文介绍一下": "甲骨文是中国商周时期刻在龟甲、兽骨上的文字，是中国最早的成熟文字，主要用于占卜记事。是汉字的鼻祖，距今3000多年历史。",
            "甲骨文用途有什么": "甲骨文主要用于殷商王室的占卜、祭祀、记事，记录了当时的天文、历法、战争、农业等信息。",
            "甲骨文有什么用途": "甲骨文主要用于殷商王室的占卜、祭祀、记事，记录了当时的天文、历法、战争、农业等信息。",
            "四方风名是什么": "四方风名是甲骨文记载的四方神明与风的名称，是中国最早的风神信仰体系。",
            "四方风神包括谁": "甲骨四方风是殷商甲骨文里记录的东方析、南方因、西方𣐺、北方夗四位风神。",
            "四方风神有哪些": "甲骨四方风是殷商甲骨文里记录的东方析、南方因、西方𣐺、北方夗四位风神。",
            "东方风神是谁": "东方风神名析，对应春季，掌管协风，寓意催生万物、草木生长。",
            "南方风神是谁": "南方风神名因，对应夏季，掌管凯风，寓意万物茂盛、温暖和煦。",
            "西方风神是谁": "西方风神名𣐺，对应秋季，掌管凉风，寓意万物收获、收敛成熟。",
            "北方风神是谁": "北方风神名夗，对应冬季，掌管寒风，寓意万物闭藏、休养生息。"
        };

        // 中文女声语音播报（标准女孩声音，完全不变）
        function speakText(text) {
            const cleanText = text.replace(/[😊~]/g, '');
            window.speechSynthesis.cancel();
            
            // 获取所有语音包，筛选中文女声
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(voice => 
                voice.lang === 'zh-CN' && (voice.name.includes('Female') || voice.name.includes('女') || voice.name.includes('Xiaoxiao') || voice.name.includes('Samantha'))
            );

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-CN';
            utterance.rate = 1;
            utterance.pitch = 1.1; // 轻微提升音调，更像女孩
            utterance.volume = 1;
            
            // 指定女声
            if (femaleVoice) utterance.voice = femaleVoice;
            window.speechSynthesis.speak(utterance);
        }

        // 页面加载后预加载语音包（必须加，否则女声不生效）
        window.addEventListener('load', () => {
            window.speechSynthesis.getVoices();
        });

        // 发送消息逻辑（完全不变）
        function sendMsg() {
            const input = document.getElementById('inputText');
            const qaBox = document.getElementById('qaBox');
            const text = input.value.trim();
            
            if (!text) return;

            qaBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';

            let reply = "抱歉，我暂时无法解答这个问题，你可以问我甲骨文、四方风名、四方风神哦~";
            for (let key in answerList) {
                if (text.includes(key)) {
                    reply = answerList[key];
                    break;
                }
            }

            setTimeout(() => {
                qaBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                qaBox.scrollTop = qaBox.scrollHeight;
                speakText(reply);
            }, 600);
        }

        // 回车发送（不变）
        document.getElementById('inputText').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
