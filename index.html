<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑";}
        body{
            background: url("forest.jpg") no-repeat center center;
            background-size: cover;
            height:100vh;display:flex;align-items:center;justify-content:center;
        }
        .card{
            background:rgba(220, 220, 220, 0.6);
            width:303px;
            padding:45px 28px;
            border-radius:24px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
            animation: cardFloat 3s ease-in-out infinite;
        }
        @keyframes cardFloat {
            0% {transform: translateY(0);}
            50% {transform: translateY(-10px);}
            100% {transform: translateY(0);}
        }
        h3{font-size:24px;margin:15px 0;color:#333;letter-spacing:2px;}
        h4{font-size:16px;color:#555;margin:10px 0;}
        p{font-size:16px;color:#666;margin:10px 0;line-height:1.8;}
        .enter-btn{
            display:inline-block;margin-top:20px;
            padding:12px 30px;background:#8cc269;color:white;
            border-radius:35px;text-decoration:none;font-size:18px;font-weight:bold;
            transition:all 0.4s ease;
            box-shadow:0 8px 15px rgba(140, 194, 105, 0.3);
        }
        .enter-btn:hover{
            background:#6eaf4b;
            transform:scale(1.1);
            box-shadow:0 12px 20px rgba(140, 194, 105, 0.4);
        }
        body::-webkit-scrollbar{display:none;}
    </style>
</head>
<body>
    <div class="card">
        <h3>四方风神的世界</h3>
        <h4>欢迎来到甲骨文与四方风神的世界</h4>
        <p>首都师范大学文化产业管理专业</p>
        <a href="main.html" class="enter-btn">Enter</a>
    </div>
</body>
</html>
